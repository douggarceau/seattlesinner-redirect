<!doctype html><html lang="en"><head><meta charset="utf-8">
<title>The Guitar Doug Report has moved</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<link rel="canonical" href="https://theguitardougreport.com/">
<style>
*{margin:0;box-sizing:border-box}
html,body{height:100%}
body{background:#05080f;overflow:hidden;display:flex;align-items:center;justify-content:center}
.tv{position:relative;width:100vw;height:100vh;background:#05080f;overflow:hidden}
#static{position:absolute;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated}
.roll{position:absolute;left:0;right:0;height:16%;top:-20%;z-index:4;
 background:linear-gradient(#ffffff55,#ffffff00);mix-blend-mode:overlay;animation:roll .5s linear infinite}
.scan{position:absolute;inset:0;z-index:5;pointer-events:none;opacity:.22;
 background:repeating-linear-gradient(#0000 0 2px,#0007 2px 3px)}
.vig{position:absolute;inset:0;z-index:6;pointer-events:none;
 box-shadow:inset 0 0 140px 30px #000c;border-radius:10px}
@keyframes roll{to{top:120%}}
/* hidden accessibility fallback; no visible text */
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media(prefers-reduced-motion:reduce){#static,.roll,.scan{display:none}}
</style></head>
<body>
<div class="tv">
 <canvas id="static"></canvas>
 <div class="roll"></div>
 <div class="scan"></div>
 <div class="vig"></div>
 <a class="sr" href="https://theguitardougreport.com/">The Guitar Doug Report</a>
 <noscript><a class="sr" href="https://theguitardougreport.com/">Continue</a></noscript>
</div>
<script>
(function(){
 var dest="https://theguitardougreport.com"+location.pathname+location.search+location.hash;
 var reduce=window.matchMedia&&matchMedia("(prefers-reduced-motion:reduce)").matches;
 if(reduce){location.replace(dest);return;}
 var cv=document.getElementById("static"),ctx=cv.getContext("2d"),raf,running=true;
 function size(){cv.width=Math.max(2,(innerWidth/3)|0);cv.height=Math.max(2,(innerHeight/3)|0);}
 size();addEventListener("resize",size);
 function draw(){
   var w=cv.width,h=cv.height,img=ctx.createImageData(w,h),d=img.data,i,v;
   for(i=0;i<d.length;i+=4){v=Math.random()*255|0;d[i]=d[i+1]=d[i+2]=v;d[i+3]=255;}
   ctx.putImageData(img,0,0);
   if(running)raf=requestAnimationFrame(draw);
 }
 draw();
 // soft TV-static hiss, where the browser allows sound (most block autoplay until a click)
 var actx,src,gain;
 function hiss(){
   try{
     var AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
     if(!actx)actx=new AC();
     var sec=3,buf=actx.createBuffer(1,actx.sampleRate*sec,actx.sampleRate),ch=buf.getChannelData(0),i;
     for(i=0;i<ch.length;i++)ch[i]=(Math.random()*2-1)*0.6;
     src=actx.createBufferSource();src.buffer=buf;
     var lp=actx.createBiquadFilter();lp.type="lowpass";lp.frequency.value=4200;
     gain=actx.createGain();gain.gain.value=0.06; // quiet on purpose
     src.connect(lp);lp.connect(gain);gain.connect(actx.destination);
     gain.gain.setValueAtTime(0.06,actx.currentTime+2.6);
     gain.gain.linearRampToValueAtTime(0,actx.currentTime+3.0);
     src.start();
     if(actx.state==="suspended")actx.resume();
   }catch(e){}
 }
 hiss();
 // if the browser blocked autoplay, start the hiss on the first touch/click
 function unlock(){if(actx&&actx.state==="suspended")actx.resume();else if(!actx)hiss();
   removeEventListener("pointerdown",unlock);removeEventListener("keydown",unlock);}
 addEventListener("pointerdown",unlock);addEventListener("keydown",unlock);
 // broken-TV static for ~3s, then hand off to the same path on the new site
 setTimeout(function(){running=false;cancelAnimationFrame(raf);
   try{if(gain)gain.gain.value=0;if(actx)actx.close();}catch(e){}
   location.replace(dest);},3000);
}());
</script>
</body></html>
